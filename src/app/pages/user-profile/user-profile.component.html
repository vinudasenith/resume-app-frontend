<div *ngIf="loading" class="p-6 text-center text-blue-600 bg-blue-50 rounded-lg shadow-sm">
    Loading user data...
</div>

<div *ngIf="!loading && userData" class="min-h-screen bg-gray-50 flex">
    <!-- Sidebar -->
    <aside class="w-100 bg-white shadow-lg border-r border-gray-200">
        <div class="p-6 flex items-center space-x-4">
            <img [src]="'https://cdn-icons-png.flaticon.com/128/3683/3683214.png'" alt="Profile"
                class="w-16 h-16 rounded-full border-2 border-blue-500 shadow-sm">
            <div>
                <h2 class="text-xl font-bold text-gray-900">{{ userData.firstName }} {{ userData.lastName }}</h2>
                <p class="text-gray-600 text-sm">{{ userData.role }}</p>
            </div>
        </div>
        <nav class="mt-6">
            <button (click)="setActiveTab('profile')"
                class="w-full text-left px-6 py-3 border-l-4 font-medium text-gray-700 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-700"
                [ngClass]="activeTab==='profile' ? 'bg-blue-50 border-blue-500 text-blue-700' : ''">
                Profile
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <!-- Profile Tab -->
        <div *ngIf="activeTab==='profile'" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
                <h3 class="text-blue-700 font-semibold mb-4">Personal Info</h3>
                <div class="text-black">
                    <p><span class="font-semibold ">First Name:</span> {{ userData.firstName }}</p>
                    <p><span class="font-semibold">Last Name:</span> {{ userData.lastName }}</p>
                    <p><span class="font-semibold">Email:</span> {{ userData.email }}</p>
                    <p><span class="font-semibold">Username:</span> {{ userData.username }}</p>
                    <p><span class="font-semibold">Role:</span> {{ userData.role }}</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div *ngIf="!loading && !userData" class="p-6 text-center text-red-700 bg-red-100 rounded-lg shadow-sm">
    Failed to load user data.
</div>
