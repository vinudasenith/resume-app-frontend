<div class="bg-white min-h-screen flex justify-center items-center">
    <div
        class="bg-gradient-to-r from-indigo-600 to-pink-500 rounded-2xl shadow-2xl p-6 md:p-8 max-w-xl w-full text-center text-white">

        <div class="text-7xl md:text-[100px] font-bold mb-2 bg-clip-text text-transparent bg-white/30">404</div>

        <div class="text-2xl md:text-3xl font-bold mb-4">Oops! Page Not Found</div>

        <div class="text-base md:text-lg mb-6 opacity-90">
            The page you're looking for doesn't exist. You might have entered the wrong URL or the page has been moved.
        </div>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <!-- Go Home Button -->
            <a [routerLink]="['/']"
                class="bg-white text-indigo-600 font-semibold py-2 px-5 rounded-full cursor-pointer hover:bg-gray-100 transition-all flex items-center justify-center">
                <i class="fas fa-home mr-2"></i>Go Home
            </a>
        </div>

    </div>
</div>
