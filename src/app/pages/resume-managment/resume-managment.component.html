<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-8xl mx-auto bg-white shadow-lg rounded-2xl p-6">
        <!-- Title -->
        <h1 class="text-2xl font-bold text-black mb-6">Resume Management</h1>

        <!-- Loading & Error -->
        <div *ngIf="loading" class="text-gray-600">Loading resumes...</div>
        <div *ngIf="error" class="text-red-600">{{ error }}</div>

        <!-- Table -->
        <div *ngIf="!loading && resumes.length > 0" class="overflow-x-auto">
            <table class="w-full border border-gray-200 rounded-lg">
                <thead class="bg-gray-100  text-gray-700">
                    <tr>
                        <th class="py-3 px-4 text-left">Email</th>
                        <th class="py-3 px-4 text-left">Resume</th>
                        <th class="py-3 px-4 text-left">ATS Score</th>
                        <th class="py-3 px-4 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let resume of resumes" class="border-b hover:bg-slate-200 text-black">
                        <td class="py-2 px-4">{{ resume.user.email }}</td>
                        <td class="py-2 px-4">{{ resume.fileName }}</td>
                        <td class="py-2 px-4">
                            <span [class.text-emerald-600]="(resume.atsCompatibility ?? 0) >= 70"
                                [class.text-amber-600]="(resume.atsCompatibility ?? 0) >= 40 && (resume.atsCompatibility ?? 0) < 70"
                                [class.text-red-600]="(resume.atsCompatibility ?? 0) < 40">
                                {{ resume.atsCompatibility !== undefined ? resume.atsCompatibility + '%' : 'N/A' }}
                            </span>
                        </td>
                        <td class="py-2 px-4 flex gap-4">
                            <a [href]="uploadsBaseUrl + '/' + resume.fileName" target="_blank"
                                class="text-blue-500 font-medium hover:bg-blue-300 hover:text-blue-800 px-2 py-1 rounded transition-all duration-200">
                                View
                            </a>
                            <button (click)="openFeedbackModal(resume)"
                                class="text-green-600 font-medium hover:bg-green-100 hover:text-green-800 px-2 py-1 rounded transition-all duration-200">
                                Feedback
                            </button>
                            <span *ngIf="resume.hasFeedback" class="text-sm text-emerald-600 font-semibold">✓Sent</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- No Data -->
        <div *ngIf="!loading && resumes.length === 0" class="text-gray-600">
            No resumes found.
        </div>
    </div>
</div>

<!-- Feedback Modal -->
<div *ngIf="showFeedbackModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Give Feedback</h2>
        <p class="text-sm text-gray-600 mb-2">
            For <span class="font-medium">{{ selectedResume?.user?.email }}</span>
        </p>


        <textarea [(ngModel)]="feedbackText" rows="5"
            class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-green-500 outline-none"
            placeholder="Write your feedback here..."></textarea>

        <div class="flex justify-end gap-4 mt-4">
            <button (click)="closeFeedbackModal()"
                class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-800">
                Cancel
            </button>
            <button (click)="sendFeedback()" [disabled]="sendingFeedback || !feedbackText.trim()"
                class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 disabled:bg-green-300">
                {{ sendingFeedback ? 'Sending...' : 'Send Feedback' }}
            </button>
        </div>
    </div>
</div>
