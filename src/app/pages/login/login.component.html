<div
    class="min-h-screen flex items-center justify-center px-4 sm:px-0 lg:px-8 bg-[url('https://images.unsplash.com/photo-1579389083078-4e7018379f7e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80')] bg-cover bg-center bg-no-repeat bg-gray-900 bg-blend-overlay bg-opacity-70">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">


        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-pink-500 py-6 px-8 text-center">

            <!-- SVG Logo -->
            <div class="flex justify-center mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12 text-white">
                    <rect x="3" y="2" width="14" height="20" rx="2" ry="2" />
                    <line x1="9" y1="8" x2="15" y2="8" />
                    <line x1="9" y1="12" x2="15" y2="12" />
                    <line x1="9" y1="16" x2="13" y2="16" />
                    <circle cx="18" cy="18" r="3" />
                    <line x1="21" y1="21" x2="20" y2="20" />
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-white">Resume Matcher Pro</h1>
            <p class="mt-1 text-blue-100">Find your perfect job match</p>
        </div>


        <!-- Form -->
        <div class="p-8">
            <form class="space-y-6" (ngSubmit)="handleLogin()" #loginForm="ngForm" novalidate>


                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-black">Email address</label>
                    <div class="mt-1">
                        <input id="email" [(ngModel)]="email" name="email" type="email" autocomplete="email" required
                            class="w-full text-black px-4 py-3 bg-slate-300 border border-white rounded-lg focus:ring-2 focus:ring-white focus:border-white transition "
                            placeholder="you@example.com ">
                    </div>
                </div>


                <!-- Password Field -->
                <div>
                    <div class="flex justify-between items-center">
                        <label for="password" class="block text-sm font-medium text-black">Password</label>
                    </div>
                    <div class="mt-1">
                        <input id="password" [(ngModel)]="password" name="password" type="password"
                            autocomplete="current-password" required
                            class="w-full px-4 py-3 bg-slate-300 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="••••••••">
                    </div>
                </div>


                <!-- Submit Button -->
                <div>
                    <button type="submit"
                        class="inline-block w-full justify-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                        Sign in
                    </button>
                </div>
            </form>


            <!-- Sign Up Link -->
            <div class="mt-6 text-center text-sm">
                <p class="text-gray-600">
                    Don't have an account?
                    <a [routerLink]="['/register']" class="font-medium text-black hover:underline">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
